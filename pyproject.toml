[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "fiberformer"
version = "0.2.0"
description = "Transformer encoder over FiberHMM footprint reads for Fiber-seq chromatin embedding."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
dependencies = [
    "torch>=2.0",
    "numpy>=1.24",
    "pandas>=2.0",
    "h5py>=3.8",
    "pyyaml>=6.0",
    "scipy>=1.10",
    "scikit-learn>=1.3",
    "umap-learn>=0.5.4",
    "matplotlib>=3.7",
]

[project.optional-dependencies]
dev = [
    "build>=1.2",
    "pytest>=8.0",
]
training = [
    "tensorboard>=2.14",
]

[project.scripts]
fiberformer-embed = "fiberformer.embedding.embed:main"
fiberformer-umap = "fiberformer.embedding.embed_umap:main"
fiberformer-build-cache = "fiberformer.scripts.build_cache:main"
fiberformer-train = "fiberformer.training.train:main"

[tool.setuptools.packages.find]
include = ["fiberformer*"]

[tool.setuptools.package-data]
fiberformer = ["configs/*.yaml", "weights/*.pt"]

[tool.pytest.ini_options]
testpaths = ["tests"]
